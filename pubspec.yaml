name: portfolio
description: Personal investment portfolio tracker for Mofid + TGJU market data.
publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.6
  dartz: ^0.10.1
  dio: ^5.11.1
  equatable: ^2.1.0
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^9.2.4
  get_it: ^9.2.1
  injectable: ^3.0.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  injectable_generator: ^3.1.3

flutter:
  uses-material-design: true
